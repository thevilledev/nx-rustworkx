name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install project
        run: uv sync --frozen --extra test
      - name: zizmor
        run: uv run --frozen zizmor .
      - name: pyright
        run: uv run --frozen pyright
      - name: pyruff
        run: uv run --frozen python scripts/pyruff_check.py

  test:
    runs-on: avrea-ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # NetworkX 3.6 supports CPython 3.11–3.14 (3.14.1 is blocklisted).
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install package
        run: uv sync --frozen --extra test
      - name: Show versions
        run: uv run --frozen python -c "import sys, networkx, rustworkx; print(sys.version); print('networkx', networkx.__version__); print('rustworkx', rustworkx.__version__)"
      - name: Package tests
        run: uv run --frozen pytest tests
      - name: NetworkX algorithm suite through the backend
        env:
          NETWORKX_TEST_BACKEND: rustworkx
        run: uv run --frozen pytest --pyargs networkx.algorithms -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
