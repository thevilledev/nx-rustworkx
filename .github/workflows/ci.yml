name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: avrea-ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # NetworkX 3.6 supports CPython 3.11–3.14 (3.14.1 is blocklisted).
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Show versions
        run: python -c "import sys, networkx, rustworkx; print(sys.version); print('networkx', networkx.__version__); print('rustworkx', rustworkx.__version__)"
      - name: Package tests
        run: python -m pytest tests
      - name: NetworkX algorithm suite through the backend
        env:
          NETWORKX_TEST_BACKEND: rustworkx
        run: python -m pytest --pyargs networkx.algorithms -q
