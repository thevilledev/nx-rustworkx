[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nx-rustworkx"
version = "0.2.1"
description = "A NetworkX backend that dispatches selected algorithms to rustworkx."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["networkx", "graphs", "algorithms", "rustworkx", "backend"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "networkx>=3.4",
    # group_*_centrality, condensation, bfs_layers, and immediate_dominators
    # only exist since rustworkx 0.18; older releases fail at call time.
    "rustworkx>=0.18",
]

[[project.authors]]
name = "Ville Vesilehto"
email = "ville@vesilehto.fi"

[project.urls]
Homepage = "https://ville.dev/nx-rustworkx/"
Documentation = "https://ville.dev/nx-rustworkx/"
"Bug Tracker" = "https://github.com/thevilledev/nx-rustworkx/issues"
"Source Code" = "https://github.com/thevilledev/nx-rustworkx"
"Release Notes" = "https://github.com/thevilledev/nx-rustworkx/releases"
PyPI = "https://pypi.org/project/nx-rustworkx/"

[project.entry-points."networkx.backends"]
rustworkx = "nx_rustworkx.interface:BackendInterface"

[project.entry-points."networkx.backend_info"]
rustworkx = "nx_rustworkx._info:get_info"

[project.optional-dependencies]
test = [
    "pytest>=7.2",
    "scipy>=1.10",
]
bench = [
    "pytest>=7.2",
    # benches/external drives third-party asv suites against this backend;
    # networkx's own suite imports pandas at collection time.
    "asv>=0.6.4",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.411",
    "pyruff>=0.15.1rc5; python_version >= '3.11'",
    "zizmor>=1.29.0",
]

[tool.uv]
# Allow pyruff's current RC pin without taking other pre-releases.
prerelease = "explicit"

[tool.setuptools.packages.find]
include = ["nx_rustworkx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["nx_rustworkx", "tests", "benches", "scripts"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
# Main's current tree predates these rules; keep them off until a dedicated cleanup.
ignore = [
    "E501",
    "B018",
    "B023",
    "B904",
    "B905",
    "SIM102",
    "SIM105",
    "UP033",
    "RUF007",
    "RUF022",
    "RUF023",
    "RUF100",
]

[tool.ruff.lint.isort]
known-first-party = ["nx_rustworkx"]

[tool.ruff.lint.per-file-ignores]
# Re-exports used by BackendInterface via getattr.
"nx_rustworkx/algorithms/__init__.py" = ["F401"]

[tool.pyright]
include = ["nx_rustworkx", "tests", "benches", "scripts"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
# NetworkX backends attach can_run to functions; __all__ is populated lazily.
reportFunctionMemberAccess = false
reportUnsupportedDunderAll = false
# NetworkX / rustworkx stubs mark dispatcher helpers as optional.
reportOptionalCall = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportOperatorIssue = false
reportAttributeAccessIssue = false
reportIndexIssue = false
reportArgumentType = false
reportAssignmentType = false
reportGeneralTypeIssues = false
reportRedeclaration = false
reportCallIssue = false
